<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusDesk | Create account</title>
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <main class="page signup-page">
      <header class="site-header">
        <a class="brand" href="/">Campus<span>Desk</span></a>
        <nav class="site-nav" aria-label="Account navigation">
          <a href="/login">Login</a>
          <a href="/signup" aria-current="page">Sign up</a>
        </nav>
      </header>

      <section class="auth-layout">
        <div class="auth-copy">
          <div class="eyebrow">Student management, made simple</div>
          <h1>Create your CampusDesk account.</h1>
          <p>Set up your student access and keep your academic information close at hand.</p>
        </div>

        <section class="form-panel" aria-labelledby="signupTitle">
          <div class="form-kicker">Student access</div>
          <h2 id="signupTitle">Sign up</h2>
          <p class="form-intro">Enter your student details to create an account.</p>
          <form id="signupForm">
            <div class="field">
              <label for="name">Full name</label>
              <input type="text" id="name" placeholder="Your name" autocomplete="name" required />
            </div>

            <div class="field">
              <label for="studentId">Student ID</label>
              <input type="text" id="studentId" placeholder="Your student ID" autocomplete="off" required />
            </div>

            <div class="field">
              <label for="email">Email address</label>
              <input type="email" id="email" placeholder="you@campus.edu" autocomplete="email" required />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="At least 10 characters" minlength="10" maxlength="128" autocomplete="new-password" required />
            </div>

            <button type="submit">Create account</button>
          </form>

          <div id="message" class="message" role="status" aria-live="polite"></div>

          <div class="footer-text">Already have an account? <a href="/login">Sign in</a></div>
        </section>
      </section>
    </main>

    <script src="/config.js"></script>
    <script>
      const isLocalDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const configuredApiBase = window.API_BASE_URL || '';
      const API_BASE = configuredApiBase.includes('student-production-5870.up.railway.app')
        ? 'https://student-admin-portal-production.up.railway.app'
        : configuredApiBase || (isLocalDevelopment ? '' : 'https://student-admin-portal-production.up.railway.app');
      const form = document.getElementById('signupForm');
      const message = document.getElementById('message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const studentId = document.getElementById('studentId').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          const response = await fetch(API_BASE + '/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, studentId, email, password })
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.message || 'Signup failed');
          }

          message.textContent = data.message;
          message.className = 'message success';
          setTimeout(() => {
            window.location.href = '/login';
          }, 1000);
        } catch (error) {
          message.textContent = error instanceof TypeError
            ? `Unable to connect to ${API_BASE}/signup. Please refresh the page and try again.`
            : error.message || 'Signup failed. Please try again.';
          message.className = 'message error';
        }
      });
    </script>
  </body>
</html>
