<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusDesk | Student Management</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #5b6577;
      --blue: #2f6af5;
      --blue-dark: #1d4ed8;
      --line: #e3e8f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #f6f8fc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      line-height: 1.5;
    }
    .page { max-width: 760px; margin: auto; padding: 0 5%; min-height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: var(--blue); }
    nav a.nav-cta { background: var(--blue); color: #fff; padding: 10px 18px; border-radius: 999px; font: 700 14px/1 inherit; text-decoration: none; }
    nav a.nav-cta:hover { background: var(--blue-dark); }

    .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 0 80px; text-align: center; }
    .eyebrow {
      align-self: center;
      color: var(--blue);
      font: 700 12px/1 Arial, sans-serif;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      background: rgba(47, 106, 245, 0.08);
      padding: 8px 14px;
      border-radius: 999px;
    }
    h1 { margin: 18px 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; letter-spacing: -1.2px; }
    h1 .accent { color: var(--blue); }
    .lead { max-width: 480px; margin: 0 auto; color: var(--muted); font-size: 16px; }
    .actions { display: flex; justify-content: center; margin-top: 28px; }
    .button {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #4a8af6);
      font: 700 15px/1 Arial, sans-serif;
      text-decoration: none;
      box-shadow: 0 14px 26px rgba(47, 106, 245, 0.28);
      transition: transform 0.15s ease;
    }
    .button:hover { transform: translateY(-2px); }

    footer { border-top: 1px solid var(--line); padding: 20px 0; text-align: center; color: var(--muted); font-size: 13px; }

    @media (max-width: 480px) {
      header { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">Campus<span>Desk</span></div>
      <nav>
        <a class="nav-cta" href="/login">Login</a>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow">Student management, made simple</div>
      <h1>Everything your campus needs, <span class="accent">in one place.</span></h1>
      <p class="lead">Admins enroll students and issue their login credentials. Students sign in with the email and password they're given — there's no self-signup.</p>
      <div class="actions">
        <a class="button" href="/login">Login to portal</a>
      </div>
    </section>

    <footer>© 2026 CampusDesk. All rights reserved.</footer>
  </main>
</body>
</html>
