<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal | CampusDesk</title>
  <style>
    :root { --ink:#172033; --muted:#687386; --blue:#2563eb; --sky:#eaf2ff; --line:#e5eaf2; --danger:#dc2626; }
    * { box-sizing:border-box; } body { margin:0; font-family:Georgia, 'Times New Roman', serif; color:var(--ink); background:#f7f8fb; }
    .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; } .side { background:#172033; color:#fff; padding:28px 20px; }
    .brand { font-size:24px; font-weight:bold; margin-bottom:50px; } .brand span { color:#74a7ff; } .nav a { display:block; color:#bfc9dc; text-decoration:none; padding:13px 14px; border-radius:8px; margin:6px 0; font-family:Arial,sans-serif; } .nav a.active,.nav a:hover { color:#fff; background:#263654; }
    main { padding:34px 5%; max-width:1400px; width:100%; } .eyebrow { color:var(--blue); text-transform:uppercase; letter-spacing:2px; font:700 12px Arial,sans-serif; } h1 { font-size:42px; margin:8px 0; } .lead { color:var(--muted); font:16px Arial,sans-serif; margin:0 0 28px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; } .stat,.panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; } .stat small { display:block; color:var(--muted); font:13px Arial,sans-serif; } .stat strong { display:block; font-size:30px; margin-top:8px; }
    .grid { display:grid; grid-template-columns:360px 1fr; gap:20px; } h2 { margin:0 0 18px; font-size:22px; } h3 { margin:0 0 12px; font-size:17px; } label { display:block; font:600 13px Arial,sans-serif; margin:14px 0 7px; } input,select,button { width:100%; padding:12px; border:1px solid #d5dce8; border-radius:7px; font:15px Arial,sans-serif; background:#fff; } button { background:var(--blue); color:#fff; border:0; cursor:pointer; font-weight:bold; margin-top:16px; } button:hover { filter:brightness(.9); } .danger { background:var(--danger); width:auto; margin:0; padding:7px 10px; font-size:12px; } .manage { margin-top:20px; border-top:1px solid var(--line); padding-top:18px; } .class-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font:14px Arial,sans-serif; }
    .toolbar { display:flex; gap:10px; margin-bottom:14px; } table { width:100%; border-collapse:collapse; font:14px Arial,sans-serif; } th,td { padding:13px 10px; text-align:left; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:12px; text-transform:uppercase; } td a { color:var(--blue); font-weight:bold; text-decoration:none; } .message { min-height:22px; margin-top:12px; font:14px Arial,sans-serif; } .ok { color:#15803d; } .error { color:var(--danger); }
    @media(max-width:900px) { .shell{grid-template-columns:1fr}.side{padding:18px}.brand{margin:0 0 12px}.nav{display:flex;gap:8px}.nav a{margin:0}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr} main{padding:24px 4%;overflow:auto} h1{font-size:34px} table{min-width:700px} }
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand">Campus<span>Desk</span></div><nav class="nav"><a class="active" href="/admin">Admin portal</a><a href="/student-portal">Student portal</a><a href="/login">Sign out</a></nav></aside>
  <main><div class="eyebrow">Administration</div><h1>Good morning, admin.</h1><p class="lead">Keep your classes and student records organized in one calm workspace.</p>
    <section class="stats"><div class="stat"><small>Total students</small><strong id="total">0</strong></div><div class="stat"><small>Total fees</small><strong id="fees">0</strong></div><div class="stat"><small>Active classes</small><strong id="classCount">0</strong></div></section>
    <div class="grid"><section class="panel"><h2>Add a student</h2><form id="studentForm"><label for="name">Student name</label><input id="name" required placeholder="e.g. Ali Khan" /><label for="className">Class</label><select id="className" required></select><label for="age">Age</label><input id="age" type="number" min="3" max="100" required /><label for="rollNo">Roll no</label><input id="rollNo" type="number" min="1" required /><label for="subject">Subject / program</label><input id="subject" required placeholder="e.g. ICS or BS Computer Science" /><label for="studentFees">Fees</label><input id="studentFees" type="number" min="0" required /><button>Add student</button></form><div id="message" class="message"></div><div class="manage"><h3>Manage classes</h3><form id="classForm"><input id="newClass" placeholder="e.g. BS 1st Semester" required /><button>Add class</button></form><div id="classList"></div></div></section>
      <section class="panel"><h2>Student directory</h2><div class="toolbar"><input id="search" placeholder="Search student..." /><select id="filter"><option value="">All classes</option></select></div><table><thead><tr><th>Name</th><th>Class</th><th>Roll no</th><th>Subject</th><th>Fees</th><th></th></tr></thead><tbody id="students"></tbody></table></section></div>
  </main></div>
<script src="/config.js"></script><script>
const API_BASE=window.API_BASE_URL||'';
let students=[], classes=[]; const $=id=>document.getElementById(id); const message=(text,good=true)=>{ $('message').textContent=text; $('message').className='message '+(good?'ok':'error'); };
async function load(){ try { [students,classes]=await Promise.all([fetch(API_BASE+'/api/students').then(r=>r.json()),fetch(API_BASE+'/api/classes').then(r=>r.json())]); renderClasses(); renderStudents(); } catch (error) { message('Could not connect to the backend.',false); } }
function renderClasses(){ const selected=$('filter').value; $('className').innerHTML='<option value="">Choose class</option>'+classes.map(c=>`<option>${c}</option>`).join(''); $('filter').innerHTML='<option value="">All classes</option>'+classes.map(c=>`<option>${c}</option>`).join(''); $('filter').value=classes.includes(selected)?selected:''; $('classCount').textContent=classes.length; $('classList').innerHTML=classes.map(c=>`<div class="class-row"><span>${c}</span><button class="danger" data-class="${encodeURIComponent(c)}">Delete</button></div>`).join(''); document.querySelectorAll('[data-class]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this class?'))return; const r=await fetch(API_BASE+'/api/classes/'+b.dataset.class,{method:'DELETE'}); const d=await r.json(); message(d.message,r.ok); if(r.ok)load();}); }
function renderStudents(){ const q=$('search').value.toLowerCase(), f=$('filter').value; const shown=students.filter(s=>(s.name||'').toLowerCase().includes(q)&&(!f||(s.className||s.class)===f)); $('total').textContent=students.length; $('fees').textContent=students.reduce((n,s)=>n+Number(s.fees||0),0).toLocaleString(); $('students').innerHTML=shown.length?shown.map(s=>`<tr><td><a href="/profile?id=${s.id}">${s.name}</a></td><td>${s.className||s.class||''}</td><td>${s.rollNo||s.roll_no||''}</td><td>${s.subject||''}</td><td>${s.fees||0}</td><td><button class="danger" data-id="${s.id}">Delete</button></td></tr>`).join(''):'<tr><td colspan="6">No students found.</td></tr>'; document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this student?'))return; const r=await fetch(API_BASE+'/api/students/'+b.dataset.id,{method:'DELETE'}); const d=await r.json(); message(d.message,r.ok); if(r.ok)load();}); }
$('studentForm').onsubmit=async e=>{e.preventDefault(); const body={name:$('name').value.trim(),className:$('className').value,age:$('age').value,rollNo:$('rollNo').value,subject:$('subject').value.trim(),fees:$('studentFees').value}; try { const r=await fetch(API_BASE+'/api/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const d=await r.json(); message(d.message,r.ok); if(r.ok){e.target.reset();load();} } catch (error) { message('Could not connect to the backend.',false); }};
$('classForm').onsubmit=async e=>{e.preventDefault(); try { const r=await fetch(API_BASE+'/api/classes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({className:$('newClass').value.trim()})}); const d=await r.json(); message(d.message,r.ok); if(r.ok){e.target.reset();load();} } catch (error) { message('Could not connect to the backend.',false); }}; $('search').oninput=renderStudents; $('filter').onchange=renderStudents; load();
</script></body></html>
