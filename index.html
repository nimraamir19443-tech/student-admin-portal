<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Admin Portal</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #f8fafc);
        color: #1f2937;
      }
      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }
      .topbar {
        background: #0f172a;
        color: white;
        padding: 18px 24px;
        border-radius: 12px 12px 0 0;
        font-size: 1.8rem;
        font-weight: bold;
        text-align: center;
      }
      .subtitle {
        margin: 8px 0 0;
        color: #cbd5e1;
        font-size: 0.95rem;
        font-weight: normal;
      }
      .card {
        background: white;
        border-radius: 0 0 12px 12px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      }
      h2 {
        margin-top: 0;
        color: #0f172a;
        text-align: center;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 20px;
      }
      .field {
        display: flex;
        flex-direction: column;
      }
      label {
        margin-bottom: 8px;
        font-weight: 600;
      }
      input, select, button {
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
      }
      input:focus, select:focus {
        outline: 2px solid #93c5fd;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: 0.2s ease;
      }
      button:hover {
        background: #1d4ed8;
      }
      .full-width {
        grid-column: 1 / -1;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin: 22px 0;
      }
      .stat {
        padding: 16px;
        border-radius: 10px;
        background: #eff6ff;
        border: 1px solid #dbeafe;
      }
      .stat strong {
        display: block;
        font-size: 1.5rem;
        color: #1d4ed8;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-top: 28px;
      }
      .filters input, .filters select {
        width: 100%;
      }
      .class-admin {
        margin-top: 26px;
        padding: 18px;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        background: #f8fbff;
      }
      .class-admin h3 {
        margin: 0 0 14px;
        color: #0f172a;
      }
      .class-form {
        display: flex;
        gap: 12px;
        margin: 0;
      }
      .class-form input {
        flex: 1;
      }
      .class-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }
      .class-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px 7px 12px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1e3a8a;
        font-weight: 600;
      }
      .class-delete-btn {
        padding: 4px 8px;
        border-radius: 999px;
        background: #ef4444;
        font-size: 0.8rem;
      }
      .message {
        margin-top: 16px;
        font-weight: bold;
      }
      .success { color: #15803d; }
      .error { color: #b91c1c; }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 28px;
      }
      th, td {
        border: 1px solid #e2e8f0;
        padding: 12px;
        text-align: left;
      }
      th {
        background: #eff6ff;
      }
      .delete-btn {
        background: #ef4444;
      }
      .delete-btn:hover {
        background: #dc2626;
      }
      @media (max-width: 650px) {
        .container { margin: 10px auto; padding: 10px; }
        .card { padding: 18px; overflow-x: auto; }
        .stats { grid-template-columns: 1fr; }
        table { min-width: 760px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        Student Admin Portal
        <p class="subtitle">Manage students, classes, subjects, and fees</p>
      </div>
      <div class="card">
        <h2>Add Student</h2>

        <div class="stats">
          <div class="stat">Total Students<strong id="totalStudents">0</strong></div>
          <div class="stat">Total Fees<strong id="totalFees">0</strong></div>
          <div class="stat">Visible Students<strong id="visibleStudents">0</strong></div>
        </div>

        <form id="studentForm">
          <div class="field">
            <label for="name">Student Name</label>
            <input type="text" id="name" name="name" placeholder="Enter student name" required />
          </div>

          <div class="field">
            <label for="className">Class</label>
            <select id="className" name="className" required>
              <option value="">Select class</option>
              <option value="1st">1st</option>
              <option value="2nd">2nd</option>
              <option value="3rd">3rd</option>
              <option value="4th">4th</option>
              <option value="5th">5th</option>
              <option value="6th">6th</option>
              <option value="7th">7th</option>
              <option value="8th">8th</option>
              <option value="9th">9th</option>
              <option value="10th">10th</option>
            </select>
          </div>

          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter age" required />
          </div>

          <div class="field">
            <label for="rollNo">Roll No</label>
            <input type="number" id="rollNo" name="rollNo" placeholder="Enter roll no" required />
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
              <option value="">Select subject</option>
              <optgroup label="Intermediate Programs">
                <option value="ICS">ICS</option>
                <option value="FCS">FCS</option>
                <option value="Pre-Medical">Pre-Medical</option>
                <option value="Pre-Engineering">Pre-Engineering</option>
                <option value="General Science">General Science</option>
                <option value="Arts">Arts</option>
                <option value="Commerce">Commerce</option>
              </optgroup>
              <optgroup label="Intermediate Subjects">
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Biology">Biology</option>
                <option value="Computer Science">Computer Science</option>
                <option value="English">English</option>
                <option value="Urdu">Urdu</option>
                <option value="Islamiat">Islamiat</option>
                <option value="Pakistan Studies">Pakistan Studies</option>
                <option value="Statistics">Statistics</option>
                <option value="Economics">Economics</option>
                <option value="Civics">Civics</option>
                <option value="Education">Education</option>
                <option value="Psychology">Psychology</option>
                <option value="Sociology">Sociology</option>
                <option value="History">History</option>
                <option value="Geography">Geography</option>
              </optgroup>
              <optgroup label="BS Subjects and Programs">
                <option value="BS Computer Science">BS Computer Science</option>
                <option value="BS Software Engineering">BS Software Engineering</option>
                <option value="BS Information Technology">BS Information Technology</option>
                <option value="BS Data Science">BS Data Science</option>
                <option value="BS Artificial Intelligence">BS Artificial Intelligence</option>
                <option value="BS Cyber Security">BS Cyber Security</option>
                <option value="BS Mathematics">BS Mathematics</option>
                <option value="BS Physics">BS Physics</option>
                <option value="BS Chemistry">BS Chemistry</option>
                <option value="BS Biology">BS Biology</option>
                <option value="BS Biotechnology">BS Biotechnology</option>
                <option value="BS Microbiology">BS Microbiology</option>
                <option value="BS English">BS English</option>
                <option value="BS Urdu">BS Urdu</option>
                <option value="BS Economics">BS Economics</option>
                <option value="BS Psychology">BS Psychology</option>
                <option value="BS Sociology">BS Sociology</option>
                <option value="BS Education">BS Education</option>
                <option value="BS Business Administration">BS Business Administration</option>
                <option value="BS Accounting and Finance">BS Accounting and Finance</option>
                <option value="BS Political Science">BS Political Science</option>
                <option value="BS International Relations">BS International Relations</option>
                <option value="BS Media Studies">BS Media Studies</option>
                <option value="BS Islamic Studies">BS Islamic Studies</option>
                <option value="BS Environmental Science">BS Environmental Science</option>
                <option value="BS Statistics">BS Statistics</option>
              </optgroup>
            </select>
          </div>

          <div class="field">
            <label for="fees">Fees</label>
            <input type="number" id="fees" name="fees" placeholder="Enter fees" required />
          </div>

          <div class="field full-width">
            <button type="submit">Save Student</button>
          </div>
        </form>

        <div id="message" class="message"></div>

        <section class="class-admin">
          <h3>Manage Classes</h3>
          <form id="classForm" class="class-form">
            <input type="text" id="classNameAdmin" placeholder="Enter a new class" required />
            <button type="submit">Add Class</button>
          </form>
          <ul id="classList" class="class-list"></ul>
        </section>

        <div class="filters">
          <input type="search" id="searchFilter" placeholder="Search student name..." />
          <select id="classFilter">
            <option value="">All classes</option>
            <option value="1st">1st</option>
            <option value="2nd">2nd</option>
            <option value="3rd">3rd</option>
            <option value="4th">4th</option>
            <option value="5th">5th</option>
            <option value="6th">6th</option>
            <option value="7th">7th</option>
            <option value="8th">8th</option>
            <option value="9th">9th</option>
            <option value="10th">10th</option>
          </select>
          <select id="subjectFilter">
            <option value="">All subjects</option>
            <optgroup label="Intermediate Programs">
              <option value="ICS">ICS</option>
              <option value="FCS">FCS</option>
              <option value="Pre-Medical">Pre-Medical</option>
              <option value="Pre-Engineering">Pre-Engineering</option>
              <option value="General Science">General Science</option>
              <option value="Arts">Arts</option>
              <option value="Commerce">Commerce</option>
            </optgroup>
            <optgroup label="Intermediate Subjects">
              <option value="Mathematics">Mathematics</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Biology">Biology</option>
              <option value="Computer Science">Computer Science</option>
              <option value="English">English</option>
              <option value="Urdu">Urdu</option>
              <option value="Islamiat">Islamiat</option>
              <option value="Pakistan Studies">Pakistan Studies</option>
              <option value="Statistics">Statistics</option>
              <option value="Economics">Economics</option>
              <option value="Civics">Civics</option>
              <option value="Education">Education</option>
              <option value="Psychology">Psychology</option>
              <option value="Sociology">Sociology</option>
              <option value="History">History</option>
              <option value="Geography">Geography</option>
            </optgroup>
            <optgroup label="BS Subjects and Programs">
              <option value="BS Computer Science">BS Computer Science</option>
              <option value="BS Software Engineering">BS Software Engineering</option>
              <option value="BS Information Technology">BS Information Technology</option>
              <option value="BS Data Science">BS Data Science</option>
              <option value="BS Artificial Intelligence">BS Artificial Intelligence</option>
              <option value="BS Cyber Security">BS Cyber Security</option>
              <option value="BS Mathematics">BS Mathematics</option>
              <option value="BS Physics">BS Physics</option>
              <option value="BS Chemistry">BS Chemistry</option>
              <option value="BS Biology">BS Biology</option>
              <option value="BS Biotechnology">BS Biotechnology</option>
              <option value="BS Microbiology">BS Microbiology</option>
              <option value="BS English">BS English</option>
              <option value="BS Urdu">BS Urdu</option>
              <option value="BS Economics">BS Economics</option>
              <option value="BS Psychology">BS Psychology</option>
              <option value="BS Sociology">BS Sociology</option>
              <option value="BS Education">BS Education</option>
              <option value="BS Business Administration">BS Business Administration</option>
              <option value="BS Accounting and Finance">BS Accounting and Finance</option>
              <option value="BS Political Science">BS Political Science</option>
              <option value="BS International Relations">BS International Relations</option>
              <option value="BS Media Studies">BS Media Studies</option>
              <option value="BS Islamic Studies">BS Islamic Studies</option>
              <option value="BS Environmental Science">BS Environmental Science</option>
              <option value="BS Statistics">BS Statistics</option>
            </optgroup>
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Class</th>
              <th>Age</th>
              <th>Roll No</th>
              <th>Subject</th>
              <th>Fees</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const form = document.getElementById('studentForm');
      const tableBody = document.getElementById('studentTableBody');
      const message = document.getElementById('message');
      const searchFilter = document.getElementById('searchFilter');
      const classFilter = document.getElementById('classFilter');
      const subjectFilter = document.getElementById('subjectFilter');
      const classForm = document.getElementById('classForm');
      const classNameAdmin = document.getElementById('classNameAdmin');
      const classList = document.getElementById('classList');
      let allStudents = [];
      let allClasses = [];

      function showMessage(text, type = 'success') {
        message.textContent = text;
        message.className = 'message ' + (type === 'success' ? 'success' : 'error');
      }

      function renderClassOptions() {
        const selectedStudentClass = document.getElementById('className').value;
        const selectedFilterClass = classFilter.value;
        document.getElementById('className').innerHTML = '<option value="">Select class</option>'
          + allClasses.map((className) => `<option value="${className}">${className}</option>`).join('');
        classFilter.innerHTML = '<option value="">All classes</option>'
          + allClasses.map((className) => `<option value="${className}">${className}</option>`).join('');
        document.getElementById('className').value = allClasses.includes(selectedStudentClass) ? selectedStudentClass : '';
        classFilter.value = allClasses.includes(selectedFilterClass) ? selectedFilterClass : '';
      }

      function renderClassList() {
        classList.innerHTML = allClasses.map((className) => `
          <li class="class-item">
            ${className}
            <button type="button" class="class-delete-btn" data-class="${encodeURIComponent(className)}">Delete</button>
          </li>
        `).join('');

        document.querySelectorAll('.class-delete-btn').forEach((button) => {
          button.addEventListener('click', async () => {
            const className = decodeURIComponent(button.dataset.class);
            if (!window.confirm(`Delete class ${className}?`)) return;

            const response = await fetch(`/api/classes/${encodeURIComponent(className)}`, { method: 'DELETE' });
            const data = await response.json();
            showMessage(data.message, response.ok ? 'success' : 'error');
            if (response.ok) loadClasses();
          });
        });
      }

      async function loadClasses() {
        const response = await fetch('/api/classes');
        allClasses = await response.json();
        renderClassOptions();
        renderClassList();
      }

      async function loadStudents() {
        try {
          const response = await fetch('http://localhost:3000/api/students');
          allStudents = await response.json();
          renderStudents();
        } catch (error) {
          console.error(error);
          showMessage('Failed to load students.', 'error');
        }
      }

      function renderStudents() {
          const search = searchFilter.value.toLowerCase();
          const selectedClass = classFilter.value;
          const selectedSubject = subjectFilter.value;
          const students = allStudents.filter((student) => {
            const studentClass = student.className || student.class || '';
            return student.name.toLowerCase().includes(search)
              && (!selectedClass || studentClass === selectedClass)
              && (!selectedSubject || student.subject === selectedSubject);
          });

          document.getElementById('totalStudents').textContent = allStudents.length;
          document.getElementById('totalFees').textContent = allStudents
            .reduce((total, student) => total + Number(student.fees || 0), 0);
          document.getElementById('visibleStudents').textContent = students.length;
          tableBody.innerHTML = '';

          if (!students.length) {
            tableBody.innerHTML = '<tr><td colspan="7">No matching students found.</td></tr>';
            return;
          }

          students.forEach((student) => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${student.name}</td>
              <td>${student.className || student.class || ''}</td>
              <td>${student.age}</td>
              <td>${student.rollNo || student.roll_no || ''}</td>
              <td>${student.subject}</td>
              <td>${student.fees}</td>
              <td><button class="delete-btn" data-id="${student.id}">Delete</button></td>
            `;
            tableBody.appendChild(row);
          });

          document.querySelectorAll('.delete-btn').forEach((button) => {
            button.addEventListener('click', async () => {
              const id = button.getAttribute('data-id');
              const res = await fetch(`http://localhost:3000/api/students/${id}`, {
                method: 'DELETE'
              });
              const data = await res.json();
              showMessage(data.message, res.ok ? 'success' : 'error');
              loadStudents();
            });
          });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const student = {
          name: document.getElementById('name').value,
          className: document.getElementById('className').value,
          age: document.getElementById('age').value,
          rollNo: document.getElementById('rollNo').value,
          subject: document.getElementById('subject').value,
          fees: document.getElementById('fees').value
        };

        try {
          const response = await fetch('http://localhost:3000/api/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Something went wrong');
          }

          showMessage(data.message, 'success');
          form.reset();
          loadStudents();
        } catch (error) {
          showMessage(error.message, 'error');
        }
      });

      classForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch('/api/classes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ className: classNameAdmin.value })
        });
        const data = await response.json();
        showMessage(data.message, response.ok ? 'success' : 'error');
        if (response.ok) {
          classForm.reset();
          loadClasses();
        }
      });

      [searchFilter, classFilter, subjectFilter].forEach((filter) => {
        filter.addEventListener('input', renderStudents);
        filter.addEventListener('change', renderStudents);
      });

      loadClasses();
      loadStudents();
    </script>
  </body>
</html>
