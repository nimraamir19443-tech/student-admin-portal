<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Student Portal | CampusDesk</title><style>:root{--ink:#172033;--blue:#2563eb;--muted:#687386;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#f7f8fb}.wrap{max-width:1100px;margin:auto;padding:50px 5%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.brand{font-size:25px;font-weight:bold}.brand span{color:var(--blue)}nav a{color:var(--blue);font:600 14px Arial,sans-serif;text-decoration:none;margin-left:18px}.eyebrow{font:700 12px Arial,sans-serif;letter-spacing:2px;color:var(--blue);text-transform:uppercase}h1{font-size:46px;margin:9px 0}.lead{color:var(--muted);font:16px Arial,sans-serif}.panel{margin-top:35px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}table{width:100%;border-collapse:collapse;font:14px Arial,sans-serif}th,td{text-align:left;padding:15px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}a{color:var(--blue);font-weight:bold;text-decoration:none}@media(max-width:700px){.wrap{padding:28px 5%}.top{align-items:flex-start}.top nav{display:flex;flex-direction:column;gap:8px}.top nav a{margin:0}h1{font-size:36px}table{min-width:620px}.panel{overflow:auto}}</style></head><body><div class="wrap"><header class="top"><div class="brand">Campus<span>Desk</span></div><nav><a href="/admin">Admin portal</a><a href="/login">Login</a></nav></header><div class="eyebrow">Student portal</div><h1>Your academic record.</h1><p class="lead">Browse registered students and open any profile for complete details.</p><section class="panel"><table><thead><tr><th>Name</th><th>Class</th><th>Roll no</th><th>Subject / program</th><th>Fees</th></tr></thead><tbody id="rows"></tbody></table></section></div><script>fetch('/api/students').then(r=>r.json()).then(students=>{document.getElementById('rows').innerHTML=students.length?students.map(s=>`<tr><td><a href="/profile?id=${s.id}">${s.name}</a></td><td>${s.className||s.class||''}</td><td>${s.rollNo||s.roll_no||''}</td><td>${s.subject||''}</td><td>${s.fees||0}</td></tr>`).join(''):'<tr><td colspan="5">No students registered.</td></tr>'})</script></body></html>
