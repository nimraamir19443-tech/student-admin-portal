<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admin Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    .content {
      padding: 30px;
    }
    
    .form-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    
    .form-section h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 1.3em;
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    
    input, select {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1em;
      font-family: inherit;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
      padding: 8px 16px;
      font-size: 0.9em;
    }
    
    .btn-danger:hover {
      background: #c82333;
    }
    
    .btn-edit {
      background: #0d6efd;
      color: white;
      padding: 8px 16px;
      font-size: 0.9em;
    }
    
    .btn-edit:hover {
      background: #0b5ed7;
    }
    
    .table-section {
      margin-top: 30px;
    }
    
    .table-section h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 1.3em;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 5px;
      overflow: hidden;
    }
    
    thead {
      background: #667eea;
      color: white;
    }
    
    th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
    }
    
    td {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }
    
    tbody tr:hover {
      background: #f8f9fa;
    }
    
    .action-btns {
      display: flex;
      gap: 8px;
    }
    
    .alert {
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
    }
    
    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    
    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    
    .no-data {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
    }
    
    .modal-content h3 {
      margin-bottom: 20px;
      color: #333;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Student Admin Portal</h1>
      <p>Manage student records efficiently</p>
    </header>
    
    <div class="content">
      <div id="alert" class="alert"></div>
      
      <div class="form-section">
        <h2>Add New Student</h2>
        <div class="form-grid">
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="text" id="rollNumber" placeholder="Roll Number" required>
          <select id="grade">
            <option value="">Select Grade</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="F">F</option>
          </select>
        </div>
        <div class="button-group">
          <button class="btn-primary" onclick="addStudent()">Add Student</button>
          <button class="btn-secondary" onclick="clearForm()">Clear</button>
        </div>
      </div>
      
      <div class="table-section">
        <h2>Students List</h2>
        <div id="studentsList" class="loading">Loading students...</div>
      </div>
    </div>
  </div>
  
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Student</h3>
      <div class="form-grid">
        <input type="text" id="editName" placeholder="Full Name" required>
        <input type="email" id="editEmail" placeholder="Email" required>
        <input type="text" id="editRollNumber" placeholder="Roll Number" required>
        <select id="editGrade">
          <option value="">Select Grade</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="F">F</option>
        </select>
      </div>
      <div class="button-group">
        <button class="btn-primary" onclick="saveStudent()">Save</button>
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
  
  <script>
    let currentEditId = null;
    const API_URL = '/api';
    
    async function loadStudents() {
      try {
        const response = await fetch(`${API_URL}/students`);
        const students = await response.json();
        
        if (students.length === 0) {
          document.getElementById('studentsList').innerHTML = '<div class="no-data">No students yet. Add one to get started!</div>';
          return;
        }
        
        let html = '<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Roll Number</th><th>Grade</th><th>Actions</th></tr></thead><tbody>';
        
        students.forEach(student => {
          html += `<tr>
            <td>#${student.id}</td>
            <td>${escapeHtml(student.name)}</td>
            <td>${escapeHtml(student.email)}</td>
            <td>${escapeHtml(student.roll_number)}</td>
            <td><strong>${student.grade || 'N/A'}</strong></td>
            <td>
              <div class="action-btns">
                <button class="btn-edit" onclick="editStudent(${student.id})">Edit</button>
                <button class="btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        
        html += '</tbody></table>';
        document.getElementById('studentsList').innerHTML = html;
      } catch (error) {
        showAlert('Error loading students: ' + error.message, 'error');
      }
    }
    
    async function addStudent() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const rollNumber = document.getElementById('rollNumber').value.trim();
      const grade = document.getElementById('grade').value;
      
      if (!name || !email || !rollNumber) {
        showAlert('Please fill in all required fields', 'error');
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/students`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, roll_number: rollNumber, grade: grade || null })
        });
        
        if (!response.ok) throw new Error('Failed to add student');
        
        showAlert('Student added successfully!', 'success');
        clearForm();
        loadStudents();
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    }
    
    async function editStudent(id) {
      try {
        const response = await fetch(`${API_URL}/students/${id}`);
        const student = await response.json();
        
        document.getElementById('editName').value = student.name;
        document.getElementById('editEmail').value = student.email;
        document.getElementById('editRollNumber').value = student.roll_number;
        document.getElementById('editGrade').value = student.grade || '';
        currentEditId = id;
        document.getElementById('editModal').classList.add('active');
      } catch (error) {
        showAlert('Error loading student: ' + error.message, 'error');
      }
    }
    
    async function saveStudent() {
      if (!currentEditId) return;
      
      const name = document.getElementById('editName').value.trim();
      const email = document.getElementById('editEmail').value.trim();
      const rollNumber = document.getElementById('editRollNumber').value.trim();
      const grade = document.getElementById('editGrade').value;
      
      if (!name || !email || !rollNumber) {
        showAlert('Please fill in all required fields', 'error');
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/students/${currentEditId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, roll_number: rollNumber, grade: grade || null })
        });
        
        if (!response.ok) throw new Error('Failed to update student');
        
        showAlert('Student updated successfully!', 'success');
        closeModal();
        loadStudents();
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    }
    
    async function deleteStudent(id) {
      if (!confirm('Are you sure you want to delete this student?')) return;
      
      try {
        const response = await fetch(`${API_URL}/students/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Failed to delete student');
        
        showAlert('Student deleted successfully!', 'success');
        loadStudents();
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    }
    
    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      currentEditId = null;
    }
    
    function clearForm() {
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('rollNumber').value = '';
      document.getElementById('grade').value = '';
    }
    
    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
      setTimeout(() => {
        alert.className = 'alert';
      }, 3000);
    }
    
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
    
    // Load students on page load
    loadStudents();
  </script>
</body>
</html>
